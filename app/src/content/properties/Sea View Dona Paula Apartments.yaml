description: RK Luxuria, Dona Paula. A rare opportunity to own a full-floor residence
  with uninterrupted 180 degree views of Miramar Bay. One apartment per floor for
  complete privacy, 3 BHK layouts with optimal light and ventilation, defined dining
  and powder room, hidden wardrobes in the bedrooms, 2 car parks and an independent
  staff studio per unit, in greenhouse-inspired architecture. First to third floors
  have 278 sq m built-up and 205 sq m carpet area. The penthouse (4th and 5th floor)
  has 278 sq m built-up, a 100 sq m extra covered terrace and a 100 sq m open terrace.
  Prices - First floor ₹4.20 Cr, Second floor ₹4.50 Cr (sold out), Third floor ₹5.25
  Cr, Penthouse ₹7.50 Cr.
