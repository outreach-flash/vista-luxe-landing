description: A luxurious sea-view residence with 6 bedrooms plus a studio apartment,
  spacious terraces, a party area and two swimming pools. Plot area 4,000 sq ft and
  super built-up area 11,000 sq ft over 3 floors, with 2 fully furnished bedrooms
  and attached bathrooms on each floor. The 4th floor has an infinity pool with an
  open terrace, and an attached basement has a second pool and party area. Another
  basement has a 1 BHK cum office with a pantry. Also includes 3 modular kitchens
  at different levels, a lift, CCTV surveillance and a servant's quarter. Asking price
  ₹18 Cr.
